services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    mem_limit: 220m
    memswap_limit: 220m
    cpus: 0.8
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      NODE_OPTIONS: --max-old-space-size=180
      SIGNALING_PING_INTERVAL_MS: "25000"
      DSAIALAP_PUBLIC_HOST: dsaialap.banglarvoice24news.com
    networks:
      - nexus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 48m
    memswap_limit: 48m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexus

  certbot:
    image: certbot/certbot:latest
    mem_limit: 64m
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 43200; done"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_secret
      POSTGRES_DB: nexus_comm
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - max_connections=40
      - -c
      - work_mem=1MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_comm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 24mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    volumes:
      - redisdata:/data
    networks:
      - nexus
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  certbot-www:

networks:
  nexus:
    driver: bridge
