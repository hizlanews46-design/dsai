worker_processes auto;
worker_rlimit_nofile 1024;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 256k;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain application/json application/javascript text/css;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  upstream dsaialap_api {
    server api:3001;
    keepalive 16;
  }

  server {
    listen 80;
    server_name dsaialap.banglarvoice24news.com;
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name dsaialap.banglarvoice24news.com;

    ssl_certificate /etc/letsencrypt/live/dsaialap.banglarvoice24news.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsaialap.banglarvoice24news.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Dsaialap-Proxy cloudflare-compatible always;

    limit_req zone=api burst=40 nodelay;
    limit_conn addr 40;

    location /socket.io/ {
      proxy_pass http://dsaialap_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    location /health {
      proxy_pass http://dsaialap_api/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://dsaialap_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
      proxy_set_header x-dsaialap-key $http_x_dsaialap_key;
    }
  }
}
